<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- RED / OFF: heaving on both armrests, shoulders forced up around her
       ears, heels off the floor — all that effort and still not up. -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fadfcb"/><stop offset="1" stop-color="#f2ccb0"/>
    </linearGradient>
  </defs>
  <!-- chair: back, arms and rear legs -->
  <rect x="146" y="252" width="12" height="92" rx="5" fill="#7d6550"/>
  <rect x="242" y="252" width="12" height="92" rx="5" fill="#7d6550"/>
  <rect x="126" y="86" width="148" height="172" rx="18" fill="#9c8064"/>
  <rect x="138" y="98" width="124" height="148" rx="14" fill="#7a3030"/>
  <rect x="146" y="106" width="108" height="20" rx="10" fill="#8d3a3a"/>
  <rect x="112" y="208" width="16" height="58" rx="7" fill="#7d6550"/>
  <rect x="272" y="208" width="16" height="58" rx="7" fill="#7d6550"/>

  <!-- knees clamped together, heels lifted: the legs contribute nothing -->
  <path d="M176 244 q-8 40 -6 62 l22 2 q0 -30 6 -64 z" fill="#3e4a5a"/>
  <path d="M224 244 q8 40 6 62 l-22 2 q0 -30 -6 -64 z" fill="#47556a"/>
  <ellipse cx="181" cy="316" rx="22" ry="12" fill="#5a4038" transform="rotate(24 181 316)"/>
  <ellipse cx="219" cy="316" rx="22" ry="12" fill="#4e372f" transform="rotate(-24 219 316)"/>

  <!-- torso jammed down into the seat -->
  <path d="M200 190 q-32 4 -48 20 q-6 20 -4 40 q52 13 104 0 q2 -20 -4 -40 q-16 -16 -48 -20 z" fill="#7d93a6"/>
  <path d="M200 196 q-14 2 -23 8 q-3 22 -1 44 q24 5 48 0 q2 -22 -1 -44 q-9 -6 -23 -8 z" fill="#f2e7d5"/>

  <!-- shoulders shoved up around her ears by the push -->
  <ellipse cx="150" cy="178" rx="30" ry="23" fill="#7d93a6"/>
  <ellipse cx="250" cy="178" rx="30" ry="23" fill="#7d93a6"/>

  <g>
  <ellipse cx="200" cy="115" rx="61" ry="62" fill="#b4b4b4"/>
  <ellipse cx="152" cy="128" rx="13" ry="23" fill="#eec4a6"/>
  <ellipse cx="248" cy="128" rx="13" ry="23" fill="#eec4a6"/>
  <ellipse cx="200" cy="122" rx="45" ry="49" fill="url(#skin)"/>
  <path d="M155 120 q0 -41 20 -54 q25 -16 50 0 q20 13 20 54 q-8 -26 -45 -26 q-37 0 -45 26 z" fill="#c4c4c4"/>
  <path d="M175 68 q20 10 34 21 q11 9 17 23 q3 -26 -10 -39 q-18 -14 -41 -5 z" fill="#d8d8d8"/>
  <g fill="#ffffff" fill-opacity="0.3" stroke="#4a4a55" stroke-width="4">
    <rect x="160" y="114" width="35" height="27" rx="13"/>
    <rect x="205" y="114" width="35" height="27" rx="13"/>
    <path d="M195 126 q5 -4 10 0" fill="none"/>
  </g>
  <path d="M164 112 l20 8" stroke="#6b6257" stroke-width="5" stroke-linecap="round"/><path d="M236 112 l-20 8" stroke="#6b6257" stroke-width="5" stroke-linecap="round"/><ellipse cx="176" cy="130" rx="4.5" ry="5" fill="#3f3a36"/><ellipse cx="224" cy="130" rx="4.5" ry="5" fill="#3f3a36"/>
  <ellipse cx="166" cy="146" rx="10" ry="6" fill="#f0a48f" fill-opacity="0.45"/>
  <ellipse cx="234" cy="146" rx="10" ry="6" fill="#f0a48f" fill-opacity="0.45"/>
  <path d="M187 154 q13 -9 26 0 q-13 14 -26 0 z" fill="#8f4a48"/>
  </g>
  
  <!-- chair: seat, armrests and front legs -->
  <rect x="120" y="236" width="160" height="26" rx="10" fill="#9c8064"/>
  <rect x="128" y="228" width="144" height="16" rx="8" fill="#7a3030"/>
  <rect x="100" y="200" width="44" height="16" rx="8" fill="#9c8064"/>
  <rect x="256" y="200" width="44" height="16" rx="8" fill="#9c8064"/>
  <rect x="124" y="258" width="13" height="88" rx="6" fill="#9c8064"/>
  <rect x="263" y="258" width="13" height="88" rx="6" fill="#9c8064"/>

  <!-- arms locked dead straight, driving down through the armrests -->
  <path d="M152 166 q-34 12 -50 32 q-9 12 -11 24 l40 9 q4 -13 14 -21 q15 -12 34 -16 z" fill="#6d8296"/>
  <path d="M248 166 q34 12 50 32 q9 12 11 24 l-40 9 q-4 -13 -14 -21 q-15 -12 -34 -16 z" fill="#6d8296"/>
  <ellipse cx="116" cy="216" rx="20" ry="16" fill="url(#skin)"/>
  <ellipse cx="284" cy="216" rx="20" ry="16" fill="url(#skin)"/>
  <path d="M101 220 q5 10 14 10 M115 223 q5 10 14 9" fill="none" stroke="#eec4a6" stroke-width="3" stroke-linecap="round"/>
  <path d="M299 220 q-5 10 -14 10 M285 223 q-5 10 -14 9" fill="none" stroke="#eec4a6" stroke-width="3" stroke-linecap="round"/>

  <!-- strain bursting off the shoulders and arms -->
  <g stroke="#a8432f" stroke-width="4.5" stroke-linecap="round" fill="none">
    <path d="M126 134 l-16 -15"/><path d="M113 154 l-19 -8"/>
    <path d="M274 134 l16 -15"/><path d="M287 154 l19 -8"/>
  </g>
  <!-- sweat -->
  <g fill="#7fb0d6">
    <path d="M262 62 q7 11 7 16 a7 7 0 0 1 -14 0 q0 -5 7 -16 z"/>
    <path d="M284 90 q6 9 6 13 a6 6 0 0 1 -12 0 q0 -4 6 -13 z"/>
    <path d="M136 60 q6 10 6 14 a6 6 0 0 1 -12 0 q0 -4 6 -14 z"/>
  </g>

  <!-- tremor at both hands and the lifted heels -->
  <path d="M64 202 q4 -6 9 0 q4 6 13 0" fill="none" stroke="#a8432f" stroke-width="3.4" stroke-linecap="round"/><path d="M64 211 q4 -6 9 0 q4 6 13 0" fill="none" stroke="#a8432f" stroke-width="3.4" stroke-linecap="round"/><path d="M64 220 q4 -6 9 0 q4 6 13 0" fill="none" stroke="#a8432f" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M320 202 q4 -6 9 0 q4 6 13 0" fill="none" stroke="#a8432f" stroke-width="3.4" stroke-linecap="round"/><path d="M320 211 q4 -6 9 0 q4 6 13 0" fill="none" stroke="#a8432f" stroke-width="3.4" stroke-linecap="round"/><path d="M320 220 q4 -6 9 0 q4 6 13 0" fill="none" stroke="#a8432f" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M128 318 q4 -6 9 0 q4 6 13 0" fill="none" stroke="#a8432f" stroke-width="3.4" stroke-linecap="round"/><path d="M128 327 q4 -6 9 0 q4 6 13 0" fill="none" stroke="#a8432f" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M248 318 q4 -6 9 0 q4 6 13 0" fill="none" stroke="#a8432f" stroke-width="3.4" stroke-linecap="round"/><path d="M248 327 q4 -6 9 0 q4 6 13 0" fill="none" stroke="#a8432f" stroke-width="3.4" stroke-linecap="round"/>
</svg>
