<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- YELLOW / ON: the same movement as red, done easily — up off the
       seat, upright, one hand only brushing the armrest. -->
  <g transform="translate(104 14) scale(0.88)"><defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fadfcb"/><stop offset="1" stop-color="#f2ccb0"/>
    </linearGradient>
  </defs>
  <!-- chair: back, arms and rear legs -->
  <rect x="146" y="252" width="12" height="92" rx="5" fill="#7d6550"/>
  <rect x="242" y="252" width="12" height="92" rx="5" fill="#7d6550"/>
  <rect x="126" y="86" width="148" height="172" rx="18" fill="#9c8064"/>
  <rect x="138" y="98" width="124" height="148" rx="14" fill="#7a3030"/>
  <rect x="146" y="106" width="108" height="20" rx="10" fill="#8d3a3a"/>
  <rect x="112" y="208" width="16" height="58" rx="7" fill="#7d6550"/>
  <rect x="272" y="208" width="16" height="58" rx="7" fill="#7d6550"/>
  <!-- chair: seat, armrests and front legs -->
  <rect x="120" y="236" width="160" height="26" rx="10" fill="#9c8064"/>
  <rect x="128" y="228" width="144" height="16" rx="8" fill="#7a3030"/>
  <rect x="100" y="200" width="44" height="16" rx="8" fill="#9c8064"/>
  <rect x="256" y="200" width="44" height="16" rx="8" fill="#9c8064"/>
  <rect x="124" y="258" width="13" height="88" rx="6" fill="#9c8064"/>
  <rect x="263" y="258" width="13" height="88" rx="6" fill="#9c8064"/></g>
  <g transform="translate(-30 0)">

  <!-- legs planted in front of the chair, straightening under her -->
  <path d="M176 250 q-8 44 -6 76 l26 0 q-2 -34 2 -76 z" fill="#f7d7bf"/>
  <path d="M226 250 q8 44 6 76 l-26 0 q2 -34 -2 -76 z" fill="#eec4a6"/>
  <ellipse cx="180" cy="336" rx="24" ry="13" fill="#5a4038"/>
  <ellipse cx="222" cy="336" rx="24" ry="13" fill="#4e372f"/>

  <!-- skirt, clear of the seat -->
  <path d="M168 196 q32 10 64 0 q7 34 12 62 q-44 12 -88 0 q6 -28 12 -62 z" fill="#3e4a5a"/>
  <path d="M200 202 q-2 30 -3 54 l7 0 q-2 -24 -4 -54 z" fill="#47556a"/>

  <!-- torso tall and open, weight already over her feet -->
  <path d="M200 112 q-34 3 -52 16 q-8 22 -6 46 q56 14 116 0 q2 -24 -6 -46 q-18 -13 -52 -16 z" fill="#7d93a6"/>
  <path d="M200 118 q-16 2 -25 8 q-2 28 0 54 q25 5 50 0 q2 -26 0 -54 q-9 -6 -25 -8 z" fill="#f2e7d5"/>
  <path d="M200 114 q-13 2 -22 6 q8 15 22 17 q14 -2 22 -17 q-9 -4 -22 -6 z" fill="#e4d4bc"/>

  <!-- one arm swinging free, the other only brushing the armrest -->
  <path d="M248 128 q17 8 21 30 q4 20 4 38 l-26 2 q0 -18 -3 -35 q-3 -19 -13 -25 z" fill="#7d93a6"/>
  <ellipse cx="260" cy="206" rx="14" ry="17" fill="url(#skin)"/>
  <path d="M152 128 q-18 8 -24 28 q-4 14 -2 26 l26 4 q-1 -10 1 -20 q3 -16 12 -22 z" fill="#7d93a6"/>
  <ellipse cx="136" cy="192" rx="15" ry="13" fill="url(#skin)"/>

  <g>
  <ellipse cx="200" cy="47" rx="61" ry="62" fill="#b4b4b4"/>
  <ellipse cx="152" cy="60" rx="13" ry="23" fill="#eec4a6"/>
  <ellipse cx="248" cy="60" rx="13" ry="23" fill="#eec4a6"/>
  <ellipse cx="200" cy="54" rx="45" ry="49" fill="url(#skin)"/>
  <path d="M155 52 q0 -41 20 -54 q25 -16 50 0 q20 13 20 54 q-8 -26 -45 -26 q-37 0 -45 26 z" fill="#c4c4c4"/>
  <path d="M175 0 q20 10 34 21 q11 9 17 23 q3 -26 -10 -39 q-18 -14 -41 -5 z" fill="#d8d8d8"/>
  <g fill="#ffffff" fill-opacity="0.3" stroke="#4a4a55" stroke-width="4">
    <rect x="160" y="46" width="35" height="27" rx="13"/>
    <rect x="205" y="46" width="35" height="27" rx="13"/>
    <path d="M195 58 q5 -4 10 0" fill="none"/>
  </g>
  <path d="M168 61 q8 -11 16 0" fill="none" stroke="#3f3a36" stroke-width="4.5" stroke-linecap="round"/><path d="M216 61 q8 -11 16 0" fill="none" stroke="#3f3a36" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="166" cy="78" rx="10" ry="6" fill="#f0a48f" fill-opacity="0.45"/>
  <ellipse cx="234" cy="78" rx="10" ry="6" fill="#f0a48f" fill-opacity="0.45"/>
  <path d="M186 85 q14 18 28 0 q-14 7 -28 0 z" fill="#b5615c"/>
  </g>
  </g>
</svg>
