<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- GREEN / dyskinesia: still in the chair, but flung about — limbs at
       wild angles, sweep arcs and echoes showing where they just were. -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fadfcb"/><stop offset="1" stop-color="#f2ccb0"/>
    </linearGradient>
  </defs>
  <!-- chair: back, arms and rear legs -->
  <rect x="146" y="252" width="12" height="92" rx="5" fill="#7d6550"/>
  <rect x="242" y="252" width="12" height="92" rx="5" fill="#7d6550"/>
  <rect x="126" y="86" width="148" height="172" rx="18" fill="#9c8064"/>
  <rect x="138" y="98" width="124" height="148" rx="14" fill="#7a3030"/>
  <rect x="146" y="106" width="108" height="20" rx="10" fill="#8d3a3a"/>
  <rect x="112" y="208" width="16" height="58" rx="7" fill="#7d6550"/>
  <rect x="272" y="208" width="16" height="58" rx="7" fill="#7d6550"/>

  <!-- legs kicking out wide, one flung higher than the other -->
  <path d="M168 240 q-34 30 -62 44 l14 26 q34 -18 66 -40 z" fill="#3e4a5a"/>
  <path d="M234 242 q30 42 44 76 l-26 10 q-14 -38 -38 -68 z" fill="#47556a"/>
  <ellipse cx="98" cy="292" rx="24" ry="13" fill="#5a4038" transform="rotate(-42 98 292)"/>
  <ellipse cx="268" cy="336" rx="24" ry="13" fill="#4e372f" transform="rotate(38 268 336)"/>

  <!-- torso wrenched off the vertical -->
  <g transform="rotate(-13 200 226)">
  <path d="M200 156 q-38 4 -58 18 q-8 26 -6 54 q62 16 128 0 q2 -28 -6 -54 q-20 -14 -58 -18 z" fill="#7d93a6"/>
  <path d="M200 162 q-17 2 -28 9 q-3 32 -1 60 q29 6 58 0 q2 -28 -1 -60 q-11 -7 -28 -9 z" fill="#f2e7d5"/>
  </g>

  <!-- where the arms were a moment ago -->
  <g opacity="0.22">
    <path d="M152 180 q-26 -4 -48 -20 l14 -24 q18 13 40 16 z" fill="#6d8296"/>
    <path d="M250 180 q26 12 52 8 l4 26 q-34 4 -64 -12 z" fill="#6d8296"/>
  </g>

  <!-- one arm thrown up and back, the other slung out and down -->
  <path d="M150 176 q-34 -18 -56 -46 q-9 -11 -14 -22 l28 -16 q6 12 14 21 q20 22 46 33 z" fill="#6d8296"/>
  <path d="M250 178 q30 14 60 12 q12 -1 22 -5 l10 30 q-14 6 -30 7 q-38 3 -70 -16 z" fill="#6d8296"/>
  <ellipse cx="68" cy="88" rx="17" ry="20" fill="url(#skin)" transform="rotate(-38 68 88)"/>
  <ellipse cx="344" cy="216" rx="17" ry="20" fill="url(#skin)" transform="rotate(72 344 216)"/>

  <g transform="rotate(14 206 108)">
  <ellipse cx="206" cy="101" rx="61" ry="62" fill="#b4b4b4"/>
  <ellipse cx="158" cy="114" rx="13" ry="23" fill="#eec4a6"/>
  <ellipse cx="254" cy="114" rx="13" ry="23" fill="#eec4a6"/>
  <ellipse cx="206" cy="108" rx="45" ry="49" fill="url(#skin)"/>
  <path d="M161 106 q0 -41 20 -54 q25 -16 50 0 q20 13 20 54 q-8 -26 -45 -26 q-37 0 -45 26 z" fill="#c4c4c4"/>
  <path d="M181 54 q20 10 34 21 q11 9 17 23 q3 -26 -10 -39 q-18 -14 -41 -5 z" fill="#d8d8d8"/>
  <g fill="#ffffff" fill-opacity="0.3" stroke="#4a4a55" stroke-width="4">
    <rect x="166" y="100" width="35" height="27" rx="13"/>
    <rect x="211" y="100" width="35" height="27" rx="13"/>
    <path d="M201 112 q5 -4 10 0" fill="none"/>
  </g>
  <path d="M170 96 l20 -3" stroke="#6b6257" stroke-width="5" stroke-linecap="round"/><path d="M242 96 l-20 -3" stroke="#6b6257" stroke-width="5" stroke-linecap="round"/><path d="M173 112 q8 8 16 0" fill="none" stroke="#3f3a36" stroke-width="4.5" stroke-linecap="round"/><path d="M223 112 q8 8 16 0" fill="none" stroke="#3f3a36" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="172" cy="132" rx="10" ry="6" fill="#f0a48f" fill-opacity="0.45"/>
  <ellipse cx="240" cy="132" rx="10" ry="6" fill="#f0a48f" fill-opacity="0.45"/>
  <path d="M191 138 q7 -8 15 0 q8 8 15 0" fill="none" stroke="#8f4a48" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <!-- chair: seat, armrests and front legs -->
  <rect x="120" y="236" width="160" height="26" rx="10" fill="#9c8064"/>
  <rect x="128" y="228" width="144" height="16" rx="8" fill="#7a3030"/>
  <rect x="100" y="200" width="44" height="16" rx="8" fill="#9c8064"/>
  <rect x="256" y="200" width="44" height="16" rx="8" fill="#9c8064"/>
  <rect x="124" y="258" width="13" height="88" rx="6" fill="#9c8064"/>
  <rect x="263" y="258" width="13" height="88" rx="6" fill="#9c8064"/>

  <!-- sweep arcs: the path each limb has just torn through -->
  <g stroke="#5f7040" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M104 46 q-30 34 -26 76"/>
    <path d="M344 168 q34 20 34 62"/>
    <path d="M74 258 q-24 22 -22 48"/>
  </g>

  <!-- movement everywhere -->
  <path d="M30 40 q6 -6 12 0 q6 6 18 0" fill="none" stroke="#5f7040" stroke-width="4.2" stroke-linecap="round"/><path d="M30 52 q6 -6 12 0 q6 6 18 0" fill="none" stroke="#5f7040" stroke-width="4.2" stroke-linecap="round"/><path d="M30 64 q6 -6 12 0 q6 6 18 0" fill="none" stroke="#5f7040" stroke-width="4.2" stroke-linecap="round"/><path d="M30 76 q6 -6 12 0 q6 6 18 0" fill="none" stroke="#5f7040" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M346 262 q6 -6 12 0 q6 6 18 0" fill="none" stroke="#5f7040" stroke-width="4.2" stroke-linecap="round"/><path d="M346 274 q6 -6 12 0 q6 6 18 0" fill="none" stroke="#5f7040" stroke-width="4.2" stroke-linecap="round"/><path d="M346 286 q6 -6 12 0 q6 6 18 0" fill="none" stroke="#5f7040" stroke-width="4.2" stroke-linecap="round"/><path d="M346 298 q6 -6 12 0 q6 6 18 0" fill="none" stroke="#5f7040" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M40 318 q5 -6 11 0 q5 6 16 0" fill="none" stroke="#5f7040" stroke-width="4" stroke-linecap="round"/><path d="M40 329 q5 -6 11 0 q5 6 16 0" fill="none" stroke="#5f7040" stroke-width="4" stroke-linecap="round"/><path d="M40 340 q5 -6 11 0 q5 6 16 0" fill="none" stroke="#5f7040" stroke-width="4" stroke-linecap="round"/>
  <path d="M300 356 q5 -6 11 0 q5 6 16 0" fill="none" stroke="#5f7040" stroke-width="4" stroke-linecap="round"/><path d="M300 367 q5 -6 11 0 q5 6 16 0" fill="none" stroke="#5f7040" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 44 q5 -6 10 0 q5 6 15 0" fill="none" stroke="#5f7040" stroke-width="3.6" stroke-linecap="round"/><path d="M150 54 q5 -6 10 0 q5 6 15 0" fill="none" stroke="#5f7040" stroke-width="3.6" stroke-linecap="round"/>
</svg>
